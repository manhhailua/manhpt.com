<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI coding agent competition cover</title>
  <desc id="desc">A four-way competition between ChatGPT, Claude, Cursor, and open agents around a central code workspace.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="74%">
      <stop offset="0%" stop-color="#e9e5dc"/>
      <stop offset="45%" stop-color="#d8d1c4"/>
      <stop offset="100%" stop-color="#0d0d0c"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="claudeOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e78a61"/>
      <stop offset="100%" stop-color="#c15f3e"/>
    </linearGradient>
    <linearGradient id="openClaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#d6002a"/>
    </linearGradient>
    <linearGradient id="cursorFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a6a6a6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="#000" opacity="0.10"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="168" width="724" height="414" rx="30" fill="url(#screen)" stroke="#f4efe6" stroke-width="2"/>
    <rect x="466" y="198" width="668" height="50" rx="13" fill="#262624"/>
    <circle cx="497" cy="223" r="7" fill="#ff5f57"/>
    <circle cx="522" cy="223" r="7" fill="#febc2e"/>
    <circle cx="547" cy="223" r="7" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#efece5">
      <text x="492" y="305">agent.task("ship-feature")</text>
      <text x="492" y="353" fill="#d7f5e6">+ chat, work, codex</text>
      <text x="492" y="401" fill="#f1c4ad">+ developer workflow</text>
      <text x="492" y="449" fill="#d8d8d8">+ repo, diff, PR review</text>
      <text x="492" y="497" fill="#ffb199">- fragmented tools</text>
    </g>
  </g>

  <g transform="translate(92 112)" filter="url(#shadow)">
    <rect width="340" height="238" rx="32" fill="#f6f3ec" stroke="#151515" stroke-width="3"/>
    <circle cx="84" cy="92" r="52" fill="#101010"/>
    <g transform="translate(84 92)" stroke="#f6f3ec" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M0-34c20 0 34 14 34 34"/>
      <path d="M34 0c0 20-14 34-34 34"/>
      <path d="M0 34c-20 0-34-14-34-34"/>
      <path d="M-34 0c0-20 14-34 34-34"/>
      <path d="M-20-26c16-16 40-7 47 10"/>
      <path d="M26-20c16 16 7 40-10 47"/>
      <path d="M20 26c-16 16-40 7-47-10"/>
      <path d="M-26 20c-16-16-7-40 10-47"/>
    </g>
    <text x="162" y="86" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#111111">ChatGPT</text>
    <text x="162" y="130" font-family="Inter, Arial, sans-serif" font-size="20" fill="#3a3a38">chat + work + codex</text>
    <path d="M254 238L440 410" stroke="#111111" stroke-width="4" stroke-dasharray="10 12" opacity="0.62"/>
  </g>

  <g transform="translate(92 552)" filter="url(#shadow)">
    <rect width="340" height="238" rx="32" fill="#f6f1e8" stroke="#d97757" stroke-width="3"/>
    <circle cx="84" cy="92" r="52" fill="#f7eee5"/>
    <g transform="translate(84 92)" fill="none" stroke="#d97757" stroke-width="11" stroke-linecap="round">
      <path d="M0-45V45"/>
      <path d="M0-45V45" transform="rotate(30)"/>
      <path d="M0-45V45" transform="rotate(60)"/>
      <path d="M0-45V45" transform="rotate(90)"/>
      <path d="M0-45V45" transform="rotate(120)"/>
      <path d="M0-45V45" transform="rotate(150)"/>
    </g>
    <circle cx="84" cy="92" r="11" fill="#d97757"/>
    <text x="162" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#15120f">Claude</text>
    <text x="162" y="130" font-family="Inter, Arial, sans-serif" font-size="20" fill="#8b4b35">terminal-native agent</text>
    <path d="M254 0L440 -170" stroke="#d97757" stroke-width="4" stroke-dasharray="10 12" opacity="0.72"/>
  </g>

  <g transform="translate(1168 112)" filter="url(#shadow)">
    <rect width="340" height="238" rx="32" fill="#060606" stroke="#f5f5f5" stroke-width="3"/>
    <g transform="translate(84 92)">
      <polygon points="0,-58 54,-28 54,30 0,60 -54,30 -54,-28" fill="#111" stroke="#f2f2f2" stroke-width="2"/>
      <polygon points="0,-58 54,-28 0,2 -54,-28" fill="#6f6f6f"/>
      <polygon points="-54,-28 0,2 0,60 -54,30" fill="#2d2d2d"/>
      <polygon points="54,-28 0,2 0,60 54,30" fill="url(#cursorFacet)"/>
      <polygon points="-22,-10 54,-28 12,18" fill="#ffffff" opacity="0.96"/>
    </g>
    <text x="162" y="86" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" fill="#f7f7f7">Cursor</text>
    <text x="162" y="130" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cfcfcf">IDE-native coding</text>
    <path d="M0 238L-270 410" stroke="#f2f2f2" stroke-width="4" stroke-dasharray="10 12" opacity="0.58"/>
  </g>

  <g transform="translate(1168 552)" filter="url(#shadow)">
    <rect width="340" height="238" rx="32" fill="#1c0908" stroke="#ff6b35" stroke-width="3"/>
    <circle cx="76" cy="92" r="48" fill="url(#openClaw)" filter="url(#soft)"/>
    <path d="M54 112c18 24 54 15 64-12 7-19-2-38-18-46 3 20-10 32-24 35 4-20 13-35 30-50-28 3-50 25-52 55-1 7 0 13 0 18z" fill="#fff7ed"/>
    <g transform="translate(128 92)" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 30L18-8"/>
      <path d="M18-8L42-22"/>
      <path d="M18-8L38 12"/>
      <path d="M18-8L30-36"/>
    </g>
    <text x="162" y="82" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850" fill="#fff7ed">Open Agents</text>
    <text x="162" y="126" font-family="Inter, Arial, sans-serif" font-size="20" fill="#fed7aa">OpenClaw · Hermes</text>
    <path d="M0 0L-270 -170" stroke="#ff6b35" stroke-width="4" stroke-dasharray="10 12" opacity="0.72"/>
  </g>

  <g transform="translate(638 642)" filter="url(#shadow)">
    <rect width="324" height="98" rx="49" fill="#111111" stroke="#f4efe6" stroke-width="2"/>
    <text x="162" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850" fill="#f7f2ea">AI Coding Agents</text>
    <text x="162" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#d8d2c8">competition for workflow ownership</text>
  </g>
</svg>
